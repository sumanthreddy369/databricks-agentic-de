# Minimal Databricks Asset Bundle definition. Not deployed in this
# environment — validated structurally only via
# .github/workflows/bundle-validate.yml (which requires DATABRICKS_HOST /
# DATABRICKS_TOKEN secrets and skips gracefully without them).
bundle:
  name: databricks-agentic-de

include:
  - resources/*.yml

# The project's own wheel, built on `databricks bundle deploy` and installed on
# the agent_pipeline_healthcheck job cluster (resources/workflows.yml). It
# carries the orchestrator_healthcheck console script, the MCP server the
# DE-mode tools run in, and the ONNX anomaly model (see pyproject.toml).
artifacts:
  agent_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  kafka_bootstrap_servers:
    description: >-
      Bootstrap servers for the patient_events Kafka/Redpanda cluster (local
      dev via docker-compose.yml). On GCP, Pub/Sub is the cloud-native managed
      alternative to self-hosting Kafka/Redpanda for this same continuous
      ADT+vitals ingestion path (consumed via the Spark Structured Streaming
      Pub/Sub connector) — not swapped in here since it would change
      pipeline/01_ingest/kafka_patient_events.py's read format; Kafka is kept
      so local dev (docker-compose) and this bundle target the same code path.
    default: localhost:19092
  provider_landing_path:
    description: GCS landing path Autoloader watches for provider roster batch files.
    default: gs://healthcare-agentic-de-landing/providers

targets:
  dev:
    mode: development
    default: true
    workspace:
      # GCP-hosted Databricks workspace. Placeholder — replace with your own
      # workspace URL before running `databricks bundle validate/deploy`.
      host: https://REPLACE-WITH-YOUR-WORKSPACE.gcp.databricks.com

  prod:
    mode: production
    workspace:
      host: https://REPLACE-WITH-YOUR-WORKSPACE.gcp.databricks.com
