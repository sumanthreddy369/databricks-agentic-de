# Databricks Asset Bundle definition. Deployed and run on the `free` target
# (Databricks Free Edition) and earlier on `dev` (a GCP trial workspace, now
# locked). CI (.github/workflows/bundle-validate.yml) validates only when
# DATABRICKS_HOST / DATABRICKS_TOKEN repo secrets exist.
bundle:
  name: databricks-agentic-de

include:
  - resources/*.yml

# The project's own wheel, built on `databricks bundle deploy` and installed on
# the agent_pipeline_healthcheck job cluster (resources/workflows.yml). It
# carries the orchestrator_healthcheck console script, the MCP server the
# DE-mode tools run in, and the ONNX anomaly model (see pyproject.toml).
artifacts:
  agent_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  kafka_bootstrap_servers:
    description: >-
      Bootstrap servers for the patient_events Kafka/Redpanda cluster (local
      dev via docker-compose.yml). On GCP, Pub/Sub is the cloud-native managed
      alternative to self-hosting Kafka/Redpanda for this same continuous
      ADT+vitals ingestion path (consumed via the Spark Structured Streaming
      Pub/Sub connector) — not swapped in here since it would change
      pipeline/01_ingest/kafka_patient_events.py's read format; Kafka is kept
      so local dev (docker-compose) and this bundle target the same code path.
    default: localhost:19092
  provider_landing_path:
    description: Landing path Autoloader watches for provider roster batch files.
    default: gs://healthcare-agentic-de-landing/providers
  patient_events_source:
    description: >-
      `kafka` (production: a broker the workspace can reach) or `files`
      (free trial / dev: JSON-lines files from simulator/file_feed.py in a
      Unity Catalog volume). See pipeline/01_ingest/kafka_patient_events.py.
    default: kafka
  patient_events_path:
    description: Volume path Autoloader reads patient event files from when the source is `files`.
    default: /Volumes/healthcare_agentic_de/bronze/landing/patient_events

targets:
  dev:
    mode: development
    default: true
    workspace:
      # The project's GCP-hosted Databricks trial workspace (dev). The URL is
      # an address, not a credential: access needs `databricks auth login`.
      host: https://8259555713942027.7.gcp.databricks.com
    # Free-trial settings: no Kafka (a cloud pipeline can't reach a laptop
    # broker), landing files in a UC volume instead of a GCS bucket, and the
    # streaming pipeline triggered on demand instead of running 24/7.
    variables:
      patient_events_source: files
      provider_landing_path: /Volumes/healthcare_agentic_de/bronze/landing/providers
    resources:
      pipelines:
        streaming_patient_pipeline:
          continuous: false

  # Databricks Free Edition (serverless, no cost, doesn't expire) - where the
  # project runs since the GCP trial workspace locked sign-in (2026-10-15).
  # Same settings as dev. CLI profile: `databricks auth login --profile free`.
  free:
    mode: development
    workspace:
      host: https://dbc-df9bb74b-bd33.cloud.databricks.com
    variables:
      patient_events_source: files
      provider_landing_path: /Volumes/healthcare_agentic_de/bronze/landing/providers
    resources:
      pipelines:
        streaming_patient_pipeline:
          continuous: false

  prod:
    mode: production
    workspace:
      host: https://REPLACE-WITH-YOUR-WORKSPACE.gcp.databricks.com
