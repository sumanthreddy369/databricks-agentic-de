[project]
name = "databricks-agentic-de"
version = "0.1.0"
description = "Healthcare streaming lakehouse (DLT + Unity Catalog) kept healthy and queryable by one hand-built orchestrator agent, with provably-enforced PHI masking and prompt-injection defense."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "confluent-kafka>=2.6.0",
    "duckdb>=1.1.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0", "pytest>=8.3.0"]
databricks = ["pyspark>=3.5.0", "delta-spark>=3.2.0", "databricks-sql-connector>=3.4.0"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "simulator", "common"]
