[project]
name = "databricks-agentic-de"
version = "0.1.0"
description = "Healthcare streaming lakehouse (DLT + Unity Catalog) kept healthy and queryable by one hand-built orchestrator agent, with provably-enforced PHI masking and prompt-injection defense."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "confluent-kafka>=2.6.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "langfuse>=2.53.0",
    "mlflow>=2.17.0",
    "scikit-learn>=1.5.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "mcp>=1.2.0",
    "google-cloud-secret-manager>=2.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.scripts]
# Run by resources/workflows.yml:agent_pipeline_healthcheck (python_wheel_task).
orchestrator_healthcheck = "agent.healthcheck:main"

[project.optional-dependencies]
dev = ["ruff>=0.7.0", "pytest>=8.3.0"]
databricks = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "databricks-sql-connector>=3.4.0",
    "databricks-vectorsearch>=0.40",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# mcp_server ships in the wheel because DE-mode tools run in an MCP server
# subprocess (`python -m mcp_server.server`, see agent/mcp_bridge.py).
packages = ["agent", "simulator", "common", "mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
# agent/tools/anomaly_score.py resolves the model three directories above
# itself, which from an installed wheel is site-packages/ml/models/.
"ml/models/vitals_anomaly.onnx" = "ml/models/vitals_anomaly.onnx"
