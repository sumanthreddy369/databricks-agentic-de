# OpenTelemetry Collector: the one place telemetry is routed.
# The agent and agent/telemetry.py send OTLP here; this forwards metrics to
# Prometheus (scraped on :8889) and traces to Jaeger. Moving to Datadog,
# Dynatrace or Grafana Cloud means adding their exporter below - the
# application code doesn't change.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Gauges are recomputed every export; drop a series if it stops arriving.
    metric_expiration: 5m
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
