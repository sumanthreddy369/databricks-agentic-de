# Keeps the SHA-pinned actions and the Python dependencies current, monthly.
# A pin only protects while someone updates it; Dependabot's PRs bump the
# SHA and its "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
