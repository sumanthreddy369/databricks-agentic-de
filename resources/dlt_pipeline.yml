# Databricks Asset Bundle resource definitions for the two DLT pipelines.
# Not deployed/validated against a real workspace in this environment — see
# .github/workflows/bundle-validate.yml, which skips gracefully without
# DATABRICKS_HOST/DATABRICKS_TOKEN secrets.
#
# Target cloud is GCP (see databricks.yml's workspace host and
# `provider_landing_path`'s gs:// default). `streaming_patient_pipeline`
# reads from Kafka/Redpanda for local-dev parity; GCP Pub/Sub is the
# cloud-native managed alternative to self-hosting Kafka for this same
# continuous ingestion path (not swapped in here — see the
# `kafka_bootstrap_servers` variable description in databricks.yml for why).
resources:
  pipelines:
    streaming_patient_pipeline:
      name: streaming_patient_pipeline
      catalog: healthcare_agentic_de
      target: silver
      continuous: true
      photon: true
      configuration:
        pipeline.kafka_bootstrap_servers: "${var.kafka_bootstrap_servers}"
      libraries:
        - file:
            path: ../pipeline/01_ingest/kafka_patient_events.py
        - file:
            path: ../pipeline/02_bronze/bronze_patient_events.py
        - file:
            path: ../pipeline/03_silver/silver_encounters.py
        - file:
            path: ../pipeline/03_silver/silver_vitals.py
        - file:
            path: ../pipeline/04_gold/gold_encounters.py
        - file:
            path: ../pipeline/04_gold/gold_vitals.py

    # Slow-changing reference data does not need a continuously-running
    # cluster — running it as a triggered pipeline on an hourly Workflow
    # (see resources/workflows.yml) is a deliberate cost/ops decision, not
    # just "two files because there are two sources."
    reference_data_pipeline:
      name: reference_data_pipeline
      catalog: healthcare_agentic_de
      target: silver
      continuous: false
      photon: true
      configuration:
        pipeline.provider_landing_path: "${var.provider_landing_path}"
      libraries:
        - file:
            path: ../pipeline/01_ingest/autoloader_provider_roster.py
        - file:
            path: ../pipeline/02_bronze/bronze_provider_roster.py
        - file:
            path: ../pipeline/03_silver/silver_providers.py
        - file:
            path: ../pipeline/04_gold/gold_providers.py
